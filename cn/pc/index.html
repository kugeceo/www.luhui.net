<meta name="twitter:title" content="luhui os http://www.luhui.net 鲁虺文化网云电脑操作系统，英文名为Operating System，简称OS，是一组主管并控制计算机操作、运用和运行硬件、软件资源以及提供公共服务来组织用户交互的系统软件程序。它是控制管理计算机系统的硬软件，分配调度资源的系统软件。操作系统的基本功能包括统一管理计算机资源，如处理器资源、IO设备资源、存储器资源和文件资源等；实现了对计算机资源的抽象，例如通过IO设备管理软件提供读写接口，文件管理软件提供操作文件接；提供了用户与计算机之间的接口，如GUI（图形用户界面）、命令形式、系统调用形式等。根据运行的环境，操作系统可以分为桌面操作系统，手机操作系统，服务器操作系统，嵌入式操作系统等。常见的操作系统有Microsoft Windows，macOS，Linux，Google Chrome OS，iOS，Android，华为鸿蒙系统等。操作系统有两个最基本的特征：并发和共享。其中，“并发”指两个或多个事件可以在 同一个时刻 发生，例如在多核CPU中，每个CPU同一时刻只有一个程序在运行。">

.project div {
	position: absolute;

	left: 46px;
	top: 18px;
	width: 132px;

	color: #ffffff;
	font-weight: bold;
	font-size: 8px;
	line-height: 13px;

	text-transform: uppercase;
}

.project .link {

	position: absolute;
	right: 12px;
	top: 8px;
	image-rendering: pixelated;

}

.project:hover {
	transition: width 0.5s cubic-bezier(0.190, 1.000, 0.220, 1.000); /* easeOutExpo */
	width: 45px;
}

.project.selected {
	transition: width 0.5s cubic-bezier(0.190, 1.000, 0.220, 1.000); /* easeOutExpo */
	width: 180px;
}

.project.selected:hover {
	width: 180px;
}

	#expand {
position: absolute;
width: 32px;
height: 32px;
right: 15px;
top: 15px;
display: none;
	}

#expand span {
	background: #888;
	display: block;
	width: 20px;
	height: 2px;
	margin: 4px 6px;
}

#expand span:nth-child(1) {
	margin-top: 8px;
}

	#viewer {
position: absolute;
width: 100%;
top: 61px;
bottom: 0px;
	}

	@media all and ( max-width: 640px ) {
#nav {
	background: none;
	height: auto;
	overflow: auto;
}
	#nav .hidden {
display: none;
	}
#logo {
	position: absolute;
	background: linear-gradient(to bottom, #000000 50%,#1d1d1d 97%,#333333 97%);
	width: 100%;
}
#projects {
	position: absolute;
	background: rgba(0,0,0,0.85);
	top: 61px;
	bottom: 0px;
	width: 100%;
	overflow: auto;
	z-index: 1;
}
.project {
	margin-left: 15px;
	width: 140px;
	display: inline;
}
.project:hover {
	width: 140px;
}
.project.selected {
	width: 140px;
}
.project.selected:hover {
	width: 140px;
}
.project .link {
	display: none;
}
#expand {
	display: block;
}
#viewer {
	z-index: 0;
}
	}
