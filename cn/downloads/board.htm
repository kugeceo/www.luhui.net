function PopWin( Url, Xsize, Ysize, Scroll )
{
	if( Xsize  == null )

	if( Ysize  == null )

	if( Scroll == null ) 
		Scroll = 'yes'
	
	var opt = "width="+Xsize+",height="+Ysize+",scrollbars="+Scroll+",toolbar=no,location=no,directories=no,status=no,menubar=no,resizable=yes,copyhistory=yes"
  
	window.open( Url, 'child', opt);
}
