<meta name="description"
  content="鲁虺网络新闻资讯资源频道提供海量新闻资讯索引服务，新闻在中国古代又称新文，近代有时泛指报纸，在日语及韩语汉字中则只有报纸一义。通常指新闻机构发布的最近发生事件的消息报道。在唐代已有“新闻”一词，孙处玄言：“恨天下无书以广新闻。”唐末诗人李咸用有《冬夕喜友生至》、《春日喜逢乡人刘松》诗，都曾提到“新闻”一词。姚福申《中国古代官报名实考》称“唐代在宣宗以后是有朝报的，至于以前是否有，尚需史料进一步证实。”南宋赵升的《朝野类要》一书记载：“边报，系沿边州郡，列日具干事人探报平安事宜，实封申尚书省枢密院；朝报，日出事宜也，每日门下后省编定，请给事判报，方行下都进奏院，报行天下，其有所谓内探、省探、衙探之类，皆衷私小报，率有漏泄之禁，故隐而号之曰新闻。”在中文里，现代意义上的“新闻”一词，最早见于1828年创刊于马六甲的月刊《天下新闻》。">
