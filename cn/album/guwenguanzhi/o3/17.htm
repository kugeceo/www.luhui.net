<pre><font color="#FF0000">原文：</font>
　　　　晋献公杀世子申生　　　　檀　弓
　　晋献公将杀其世子申生。公子重耳谓之曰：“子盖，言子之志于公乎？”世子曰：“不
可。君安骊姬，是我伤公之心也！”曰：“然则盖行乎？”世子曰：“不可。君谓我欲杀君
也。天下岂有无父之国哉？我何行如之？”　使人辞于狐辞狐突曰：“申生有罪，不念伯氏
之言也，以至于死；申生不敢爱其死？虽然，吾君老矣，子少，国家多难。伯氏不出而图吾
君；伯氏苟出而图吾君，申生受赐而死！”再拜稽首，乃卒。是以为恭世子也。
