<pre><font color="#FF0000">原文：</font>
　　　　郑伯克段于鄢　隐公元年　　　　谷梁传
　　克者何？能也。何能也？能杀也。何以不言杀？见段之有徒众也。段，郑伯弟也。何以
知其为弟也？杀世子、母弟目君；以其目君，知其为弟也。段，弟也，而弗谓弟；公子也，
而弗谓公子。贬之也。段失子弟之道矣。贱段而甚郑伯也。何甚乎郑伯？甚郑伯之处心积虑
，成于杀也。于鄢，远也。犹曰取之其母之怀中而杀之云尔，甚之也。然则为郑伯者宜奈何
？缓追逸贼，亲亲之道也。
