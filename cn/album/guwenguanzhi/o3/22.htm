<pre><font color="#FF0000">原文：</font>
　　　　晋献文子成室　　　　檀　弓
　　晋献文子成室，晋大夫发焉。
　　张老曰：“美哉轮焉！美哉奂焉！歌于斯，哭于斯，聚国族于斯！”文子曰：“武也得
歌于斯，哭于斯，聚国族于斯，是全要领以从先大夫于九京也！”北面再拜稽首。
　　君子谓之善颂善祷。
<font color="#FF0000">大意：</font>
　　　(一)自“晋献文子成室”至“晋大夫发焉”
　　　　　记叙晋大夫往贺文子成室。
　　　(二)自“张老曰”至“北面再拜稽首”
　　　　　记叙文子善祷，张老善颂的话。
　　　(三)“君子谓之善颂善祷”句
　　　　　记叙君子之谓。
<font color="#FF0000">主旨：</font>说明知福惜福者得享福。（篇外）
<font color="#FF0000">文体：</font>记叙文。</pre>
