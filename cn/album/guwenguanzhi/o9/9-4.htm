<pre><font color="#FF0000">原文：</font>
　　　　罴说　　　　柳宗元
　　鹿畏貙，貙畏虎，虎畏罴。罴之状，被发人立，绝有力而甚害人焉。
　　楚之南有猎者，能吹竹为百兽之音。寂寂持弓矢罂火，而即之山，为鹿鸣以惑其类，伺
其至，发火而射之。貙闻其鹿也，趋而至。其人恐，因为虎而骇之。貙走而虎至，愈恐，则
又为罴，虎亦亡去。罴闻而求其类，至，则人也。捽搏挽裂而食之。
　　今夫不善内而恃外者，未有不为罴之食也。
