<pre><font color="#FF0000">原文：</font>
　　　　齐桓下拜受胙　僖公九年　　　左　传
　　会于葵丘。寻盟，且脩好，礼也。
　　王使宰孔赐其侯胙，曰：“天子有事于文、武，使孔赐伯舅胙。”齐侯将下拜。孔曰：
“且有后命。天子使孔曰：‘以伯舅耋老，加劳，赐一级，无下拜。’”
　　对曰：“天威不违颜咫尺，小白余敢贪天子之命，无下拜？恐陨越于下，以遗天子羞，
敢不下拜。”下，拜；登，受。
