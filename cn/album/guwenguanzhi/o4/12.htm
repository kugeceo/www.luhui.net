<pre><font color="#FF0000">原文：</font>
　　　　唐雎说信陵君　　　　战国策
　　信陵君杀晋鄙，救邯郸，破秦人，存赵国，赵王自郊迎。
　　唐雎谓信陵君曰：“臣闻之曰，事有不可知者，有不可不知者；有不可忘者，有不可不
忘者。”信陵君曰：“何谓也？”对曰：“
人之憎我也，不可不知也；吾憎人也，不可得而知也。人之有德于我也，不可忘也；吾有德
于人也，不可不忘也。今君杀晋鄙，救邯郸，破秦人，存赵国，此大德也。今赵王自郊迎，
卒然见赵王，臣愿君之忘之也。”信陵君曰：“无忌谨受教。”
