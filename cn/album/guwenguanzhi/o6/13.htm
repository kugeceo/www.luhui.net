<pre><font color="#FF0000">原文：</font>
　　　　临淄劳耿弇　　　　汉光武帝
　　车驾至临淄自劳军，群臣大会。帝谓弇曰：
　　“昔韩信破历下以开基，今将军攻祝阿以发迹，此皆齐之西界，功足相方。而韩信袭击
已降，将军独拔勍敌，其功乃难于信也。
　　“又田横亨郦生，及田横降，高帝诏卫尉不听为仇。张步前亦杀伏隆，若步来归命，吾
当诏大司徒释其怨，又事尤相类也。
　　“将军前在南阳建此大策，常以为落落难合，有志者事竟成也！”
