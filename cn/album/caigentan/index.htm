      <p align="center"><font size="6" color="#FF0000" face="隶书">菜 根 谭</font>
      </p>
      <p align="center"><br>
      <font color="#0000FF" size="4">［明］ 洪应明</font></p>
      <p><br>
      <br>
&nbsp;&nbsp;&nbsp; 
      余过古刹，于残经败纸中拾得《菜根谭》一录。翻视之，虽属禅宗，然于身心性命之学，实有隐隐相发明者。亟携归，重加校雠，缮写成帙。旧有序，文不雅驯，且于是书无关涉语，故芟之。著是书者为洪应明，究不知其为何许人也。<br>
      <br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      乾隆五十九年二月二日，遂初堂主人识</td>
